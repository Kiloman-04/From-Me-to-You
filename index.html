<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>From Me to You — Daily Message</title>
<style>
:root{--wine:#351522;--rose:#d9a5b5;--cream:#fff7f3;--gold:#d9bd83}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at top,#633447,#24121b 70%);font-family:Georgia,serif;color:var(--cream)}
main{width:min(560px,100%);text-align:center;padding:42px 28px;border:1px solid #d9bd8366;border-radius:26px;background:#2c1520eF;box-shadow:0 24px 80px #0006}
.heart{font-size:28px;color:var(--rose)}h1{font-weight:400;font-style:italic;font-size:clamp(2.2rem,8vw,3.5rem);margin:12px 0 4px;color:#f4dce3}
.tag{letter-spacing:.22em;text-transform:uppercase;font:11px Arial,sans-serif;color:var(--gold)}
.rule{height:1px;background:#d9bd8366;margin:28px auto;width:70%}
.from{font:12px Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--rose)}
.message{font-size:clamp(1.2rem,4vw,1.55rem);line-height:1.65;white-space:pre-wrap;margin:18px 0 26px}
.date{font:12px Arial,sans-serif;color:#d9bd83}
.small{font:12px Arial,sans-serif;color:#c9aeb7;margin-top:24px}
</style></head>
<body><main>
<div class="heart">♥</div><h1>From Me to You</h1><div class="tag">Daily Message</div>
<div class="rule"></div>
<div class="from" id="sender">A little note for you</div>
<div class="message" id="message">Your message is on its way…</div>
<div class="date" id="date"></div>
<div class="small" id="status">A little love, just for you.</div>
</main>
<script>
const $=id=>document.getElementById(id);
function b64ToBytes(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
async function decrypt(data,keyText){
 const raw=b64ToBytes(keyText); const key=await crypto.subtle.importKey("raw",raw,{name:"AES-GCM"},false,["decrypt"]);
 const salt=b64ToBytes(data.salt),iv=b64ToBytes(data.iv),cipher=b64ToBytes(data.ciphertext);
 const plain=await crypto.subtle.decrypt({name:"AES-GCM",iv},key,cipher);
 return JSON.parse(new TextDecoder().decode(plain));
}
(async()=>{
 const today=new Intl.DateTimeFormat("en-CA").format(new Date());
 $("date").textContent=new Date().toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"});
 const key=location.hash.slice(1);
 if(!key){$("message").textContent="This little note needs its private link to open."; $("status").textContent="Please open the link shared with you.";return}
 try{
  const r=await fetch("./messages.enc.json",{cache:"no-store"});
  if(!r.ok)throw new Error("No message file yet");
  const data=await r.json();const items=await decrypt(data,key);
  const item=items[today];
  if(item){$("sender").textContent=item.nickname||"From me";$("message").textContent=item.message}
  else{$("sender").textContent="A little note for you";$("message").textContent="No message scheduled for today. But you're still thought of. ♥"}
 }catch(e){$("message").textContent="This note isn't ready yet. Please try again later."; $("status").textContent="The message may not have been published yet."}
})();
</script></body></html>
