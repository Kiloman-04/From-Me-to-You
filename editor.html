<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>From Me to You — Private Editor</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#f8eef1;color:#351522;font-family:Arial,sans-serif}
main{max-width:720px;margin:20px auto;background:#fffaf8;border:1px solid #ead3da;border-radius:20px;padding:28px;box-shadow:0 12px 40px #4b1d2b12}
h1{font:italic 36px Georgia;margin:0 0 4px} .sub{color:#805969;margin:0 0 24px}
label{display:block;font-size:13px;font-weight:700;margin:16px 0 7px}
input,textarea{width:100%;padding:12px;border:1px solid #d8bbc5;border-radius:10px;font:15px Arial;background:white;color:#351522}
textarea{min-height:130px;resize:vertical}
button{border:0;border-radius:10px;padding:12px 16px;background:#632d43;color:white;font-weight:700;cursor:pointer;margin:14px 8px 0 0}
button.secondary{background:#ead3da;color:#351522}.hint{font-size:13px;line-height:1.55;color:#765563}
#status{margin-top:16px;font-size:14px;color:#4f713f;white-space:pre-wrap}.entry{padding:14px 0;border-bottom:1px solid #ead3da}
</style></head><body><main>
<h1>From Me to You</h1><p class="sub">Daily Message · private editor</p>
<p class="hint"><b>How this works:</b> Messages are encrypted in this browser before you download the file. Upload the downloaded <code>messages.enc.json</code> to your GitHub repository to publish changes. Keep your key safe.</p>
<label for="key">Private encryption key</label><input id="key" type="text" autocomplete="off" placeholder="Paste your saved key, or create one below">
<button class="secondary" id="newkey">Create a new key</button>
<label for="date">Message date</label><input id="date" type="date">
<label for="nickname">Sender nickname for this date</label><input id="nickname" placeholder="e.g. Someone who cares">
<label for="message">Message</label><textarea id="message" placeholder="Write your little message here…"></textarea>
<button id="save">Save / update date</button><button class="secondary" id="remove">Delete date</button>
<button id="export">Encrypt & download messages.enc.json</button>
<div id="status"></div><div id="list"></div>
</main>
<script>
const $=id=>document.getElementById(id);let entries={};
const enc=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
function bytes(s){return Uint8Array.from(atob(s),c=>c.charCodeAt(0))}
function randomKey(){return enc(crypto.getRandomValues(new Uint8Array(32)))}
function validKey(){const k=$("key").value.trim();if(!k)throw Error("Create or paste your private key first.");return k}
function render(){const dates=Object.keys(entries).sort();$("list").innerHTML=dates.length?'<h3>Saved dates</h3>'+dates.map(d=>`<div class="entry"><b>${d}</b> — ${escapeHtml(entries[d].nickname||"No nickname")}<br>${escapeHtml(entries[d].message.slice(0,100))}</div>`).join(""):""}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
$("newkey").onclick=()=>{$("key").value=randomKey();$("status").textContent="New key created. Save it somewhere safe. The same key is needed to update messages and to build the recipient link."};
$("save").onclick=()=>{try{validKey();const d=$("date").value,m=$("message").value.trim();if(!d||!m)throw Error("Choose a date and write a message.");entries[d]={nickname:$("nickname").value.trim(),message:m};render();$("status").textContent="Saved in this editor session. Download the encrypted file to publish it."}catch(e){$("status").textContent=e.message}};
$("remove").onclick=()=>{const d=$("date").value;if(!d||!entries[d]){$("status").textContent="No saved message for that date.";return}delete entries[d];render();$("status").textContent="Deleted from this editor session. Download the encrypted file to publish the change."};
$("date").onchange=()=>{const e=entries[$("date").value];$("nickname").value=e?.nickname||"";$("message").value=e?.message||""};
$("export").onclick=async()=>{try{const k=validKey();const raw=bytes(k);const key=await crypto.subtle.importKey("raw",raw,{name:"AES-GCM"},false,["encrypt"]);const iv=crypto.getRandomValues(new Uint8Array(12));const data=new TextEncoder().encode(JSON.stringify(entries));const cipher=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,data);const out={version:1,algorithm:"AES-GCM",iv:enc(iv),salt:"",ciphertext:enc(cipher)};const blob=new Blob([JSON.stringify(out,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="messages.enc.json";a.click();URL.revokeObjectURL(a.href);$("status").textContent="Encrypted file downloaded. Upload it to your GitHub repository to publish."}catch(e){$("status").textContent=e.message}};
render();
</script></body></html>
